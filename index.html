<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>سفر به آسمان از دبیرستان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* Concept: "mission control" deck for 15-16 year olds. Dark observatory palette, glass panels, big hooks, one live widget per idea. */
:root{
  --bg:#050816;--panel:rgba(14,22,62,.66);--panel2:rgba(255,255,255,.055);--line:rgba(160,180,255,.2);
  --tx:#eef2ff;--mu:#aab5e8;--cy:#4fd8ff;--am:#ffc857;--mg:#ff6b9a;--vi:#9b8cff;--gr:#5cf2b0;--rd:#ff6a5c;--dk:#121033;
  --disp:'Lalezar','Vazirmatn',system-ui,sans-serif;
  --body:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:clamp(15px,.9vw + 8px,21px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--body);line-height:1.75;overflow:hidden}
button,input,select{font-family:inherit;color:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
[hidden]{display:none!important}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 50% at 88% 8%,rgba(155,140,255,.28),transparent 70%),
  radial-gradient(55% 45% at 8% 92%,rgba(79,216,255,.14),transparent 70%),
  radial-gradient(50% 40% at 55% 60%,rgba(255,107,154,.08),transparent 70%),
  linear-gradient(180deg,#050816 0%,#0a1034 58%,#120d33 100%)}
#sky,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:1}#confetti{z-index:90}
#app{position:fixed;inset:0;z-index:2}

/* top bar */
.top{position:fixed;z-index:30;inset-inline:0;top:0;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:linear-gradient(180deg,rgba(5,8,22,.92),rgba(5,8,22,0))}
.tools{display:flex;gap:6px;flex:none}
.chipbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.15em .85em;font-size:.78rem;cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px);line-height:1.9}
.chipbtn:hover,.chipbtn.on{border-color:var(--am);color:var(--am)}
.secs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.secs::-webkit-scrollbar{display:none}
.sc{flex:none;display:flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;border-radius:999px;padding:.05em .7em .05em .55em;font-size:.74rem;color:var(--mu);cursor:pointer;line-height:1.9}
.sc i{font-style:normal;width:1.55em;height:1.55em;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.09);font-size:.72rem;font-weight:800}
.sc:hover{color:var(--tx)}
.sc.now{border-color:var(--am);color:var(--am);background:rgba(255,200,87,.08)}
.sc.now i{background:var(--am);color:var(--dk)}
.sc.done i{background:rgba(92,242,176,.25);color:var(--gr)}

/* slides */
.slide{position:absolute;inset:0;display:flex;padding:56px 16px 82px;overflow-y:auto;overflow-x:hidden;
  opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .45s ease,transform .45s ease,visibility 0s .45s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .45s ease}
.wrap{margin:auto;width:100%;max-width:1180px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.on .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.1s)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.82rem;letter-spacing:.06em;color:var(--cy);font-weight:600}
.eyebrow b{color:var(--am);font-weight:800}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(2.8rem,8.5vw,5.8rem);background:linear-gradient(180deg,#fff 20%,var(--am));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,200,87,.3))}
h2{font-size:clamp(1.7rem,4.2vw,2.8rem)}
h3{font-size:1.5rem;color:var(--am)}
h4{margin:0;font-size:1rem;font-weight:800;color:var(--cy)}
p{margin:0}
.sub{font-size:clamp(1.05rem,2.4vw,1.5rem);color:var(--mu);text-wrap:balance}
.hint{color:var(--mu);font-size:.88rem}
.lab{color:var(--mu);font-size:.9rem}

/* buttons */
.btn{border:0;cursor:pointer;border-radius:999px;padding:.5em 1.4em;font-size:1rem;font-weight:800;background:linear-gradient(135deg,#ffe28a,var(--am) 55%,#ffa94d);color:var(--dk);box-shadow:0 8px 26px rgba(255,200,87,.25);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--am);color:var(--am)}
.btn.sm{font-size:.85rem;padding:.3em 1em}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.tab{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:.2em 1.1em;cursor:pointer;font-weight:600;font-size:.92rem}
.tab:hover{border-color:var(--cy)}
.tab.act{border-color:var(--am);color:var(--am);background:rgba(255,200,87,.08)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px;backdrop-filter:blur(8px);min-width:0;text-align:start}
.panel h3{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;align-items:start}
.grid21{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;width:100%;align-items:start}
.badge{display:inline-block;font-size:.76rem;font-weight:800;padding:.05em .9em;border-radius:999px;background:rgba(79,216,255,.16);color:var(--cy)}
.badge.am{background:rgba(255,200,87,.16);color:var(--am)}
.badge.gr{background:rgba(92,242,176,.16);color:var(--gr)}
.badge.mg{background:rgba(255,107,154,.16);color:var(--mg)}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:.98rem;text-align:start}
.fact b{color:var(--am)}
.fact.swap{animation:rise .4s both}
.callout{background:rgba(79,216,255,.1);border:1px solid rgba(79,216,255,.38);border-radius:16px;padding:10px 16px;font-size:.95rem;text-align:start}
.callout.warn{background:rgba(255,106,92,.12);border-color:rgba(255,106,92,.5)}
.callout.ok{background:rgba(92,242,176,.1);border-color:rgba(92,242,176,.4)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px 11px;display:flex;flex-direction:column;min-width:0;text-align:start}
.tile span{font-size:.74rem;color:var(--mu)}
.tile b{font-size:.92rem;font-weight:600;overflow-wrap:anywhere}
.list{margin:0;padding-inline-start:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.96rem;text-align:start}
.big{font-family:var(--disp);font-size:clamp(1.8rem,5vw,3.4rem);color:var(--am);line-height:1.2}
.pmsg{min-height:1.6em;font-weight:600;font-size:1.02rem}
.pmsg.ok{color:var(--gr)}.pmsg.no{color:var(--rd)}

/* hook */
.hookbox{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:880px}
.q{font-size:clamp(1.7rem,4.8vw,3.2rem);line-height:1.5}
.ans{background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.5);border-radius:18px;padding:12px 20px;font-size:1.05rem;text-align:start;animation:rise .5s both}
.ans b{color:var(--am)}

/* ranges */
input[type=range]{accent-color:#ffc857;height:30px;width:100%;cursor:pointer}
.ctl{display:flex;flex-direction:column;gap:2px;text-align:start;width:100%}
.ctl label{font-size:.88rem;color:var(--mu);display:flex;justify-content:space-between;gap:10px}
.ctl label b{color:var(--tx);font-variant-numeric:tabular-nums}
select{min-width:10.5rem;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.2em .7em;cursor:pointer}
select option{background:#0b1030;color:#fff}
canvas.cv,svg.cv{width:100%;height:auto;display:block;border-radius:16px;background:rgba(3,6,20,.55);border:1px solid var(--line);touch-action:none}
.sph{display:inline-block;border-radius:50%;flex:none;position:relative}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.sel{outline:3px solid var(--am);outline-offset:2px}

/* nav + drawer + timer */
.nav{position:fixed;z-index:30;inset-inline:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(5,8,22,.92),rgba(5,8,22,0))}
.nbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-size:1.2rem;display:grid;place-items:center}
.nbtn:hover{border-color:var(--am);color:var(--am)}.nbtn:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:70vw}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(170,182,255,.3);border:0;padding:0;cursor:pointer;transition:all .25s}
.dot.opt{background:rgba(255,200,87,.3)}
.dot.on{background:var(--am);width:22px;border-radius:5px}
.timer{position:fixed;z-index:40;inset-inline-start:12px;bottom:62px;background:rgba(8,12,38,.92);border:1px solid var(--line);border-radius:16px;padding:10px 14px;min-width:230px;text-align:start;backdrop-filter:blur(8px);font-size:.85rem}
.timer .t1{font-family:var(--disp);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.timer .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0}
.timer .bar b{display:block;height:100%;background:var(--gr);width:0;transition:width .4s,background .4s}
.timer .st{font-weight:700}
.timer .st.late{color:var(--rd)}.timer .st.early{color:var(--gr)}.timer .st.ok{color:var(--mu)}
.drawer{position:fixed;z-index:50;left:0;top:0;bottom:0;width:min(430px,100%);background:rgba(8,12,40,.97);backdrop-filter:blur(14px);border-inline-end:1px solid var(--line);
  transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:16px 18px 24px;text-align:start}
.drawer.open{transform:none}
.drawer h3{margin:16px 0 6px;font-size:1.25rem}
.drawer .list{font-size:.92rem}

@media (max-width:900px){
  .grid2,.grid21,.grid3{grid-template-columns:1fr}
  .tools .chipbtn.opt-m{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* m01 */
.orrery{position:relative;width:clamp(200px,min(52vw,34vh),340px);aspect-ratio:1}
.sunc{position:absolute;left:41%;top:41%;width:18%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,var(--am) 45%,#ff8a3d);box-shadow:0 0 40px 14px rgba(255,170,70,.55),0 0 110px 40px rgba(255,140,60,.25);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 56px 20px rgba(255,170,70,.65),0 0 130px 50px rgba(255,140,60,.3)}}
.ring{position:absolute;width:var(--d);aspect-ratio:1;left:calc((100% - var(--d))/2);top:calc((100% - var(--d))/2);border:1px dashed rgba(170,182,255,.28);border-radius:50%;animation:spin var(--t) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pl{position:absolute;top:0;left:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),var(--c) 45%,rgba(0,0,0,.65))}
.moonring{position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;margin:-150% 0 0 -150%;border:1px dashed rgba(255,255,255,.25);border-radius:50%;animation:spin 3s linear infinite}
.moon{position:absolute;top:0;left:50%;width:34%;aspect-ratio:1;margin:-17% 0 0 -17%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c3c7d8 55%,#6a6f86)}
.dotc{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-inline-end:.45em;vertical-align:baseline}
.slide .q{font-size:clamp(1.2rem,2.5vw,1.8rem);line-height:1.55}
.hookbox .btn{font-size:.85rem;padding:.3em 1.1em}
.slide .hookbox{gap:10px}
.sunoff{position:relative;height:110px;border-radius:14px;background:rgba(3,6,20,.55);border:1px solid var(--line);overflow:hidden;margin-bottom:8px}
.so-sun{position:absolute;inset-inline-end:14px;top:50%;width:62px;height:62px;margin-top:-31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,var(--am) 45%,#ff8a3d);box-shadow:0 0 30px 10px rgba(255,170,70,.5);transition:all .6s}
.so-sun.off{background:#1a1a30;box-shadow:none}
.so-earth{position:absolute;inset-inline-start:22px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff,#2f7dff 50%,#0d2f78);transition:all 1.4s}
.so-earth.gone{filter:brightness(.15);transform:translate(-90px,-70px);opacity:.3}
.so-wave{position:absolute;inset-inline-end:46px;top:50%;height:4px;width:0;margin-top:-2px;background:linear-gradient(270deg,#ffe28a,transparent);border-radius:3px;box-shadow:0 0 10px #ffc857}
.zc{fill:rgba(255,255,255,.015);stroke:rgba(160,180,255,.22);stroke-width:1;transition:all .4s}
.zc.in{stroke:rgba(79,216,255,.55);fill:rgba(79,216,255,.05)}
.zc.now{stroke:var(--am);stroke-width:2.5;fill:rgba(255,200,87,.1);filter:drop-shadow(0 0 6px var(--am))}
.zy{fill:var(--mu);font-size:11px;font-family:var(--body)}
.addr{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.addr li{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:.05em .8em;font-size:.82rem;color:var(--mu);opacity:.45;transition:all .3s}
.addr li.on{opacity:1;color:var(--tx);border-color:rgba(255,200,87,.5)}
.addr li+li::before{content:"";}

/* m2 */
.ot{fill:#aab5e8;font-size:10.5px;font-family:var(--body)}
.rt{fill:#fff;font-size:12.5px;font-family:var(--body)}

/* m34 */
.sly{cursor:pointer;stroke:rgba(255,255,255,.18);stroke-width:1;transition:filter .2s}
.sly:hover{filter:brightness(1.25)}
.sly.act{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 0 8px #fff)}
.sf{position:relative;height:92px;border-radius:14px;background:rgba(3,6,20,.55);border:1px solid var(--line);overflow:hidden;margin-bottom:8px}
.sf-sun{position:absolute;inset-inline-end:-30px;top:50%;width:90px;height:90px;margin-top:-45px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9,var(--am) 45%,#ff8a3d);box-shadow:0 0 30px 8px rgba(255,170,70,.5)}
.sf-sun.fl{animation:flr 1.2s ease-out}
@keyframes flr{20%{box-shadow:0 0 90px 50px #fff,0 0 160px 80px #ffb347;filter:brightness(1.8)}}
.sf-e{position:absolute;inset-inline-start:20px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff,#2f7dff 50%,#0d2f78)}
.sf-p{position:absolute;inset-block:0;inset-inline-end:60px;width:0;background:linear-gradient(270deg,rgba(255,255,255,.0),rgba(255,230,150,.45));opacity:0}
.sf-p.p1{opacity:1;width:calc(100% - 90px);transition:width 1.2s linear}
.sf-p.p2{background:linear-gradient(270deg,rgba(255,106,92,0),rgba(255,106,92,.4))}
.sf-p.p3{background:linear-gradient(270deg,rgba(155,140,255,0),rgba(92,242,176,.5))}
sup{font-size:.7em}

/* m56 */
.sph.sun{box-shadow:0 0 40px 10px rgba(255,170,70,.5)}
.sph::after,.sph::before{content:"";position:absolute;pointer-events:none}
.sph.crater::after{inset:0;border-radius:50%;background:radial-gradient(circle at 28% 38%,rgba(0,0,0,.2) 0 7%,transparent 8%),radial-gradient(circle at 62% 28%,rgba(0,0,0,.16) 0 5%,transparent 6%),radial-gradient(circle at 56% 66%,rgba(0,0,0,.2) 0 9%,transparent 10%),radial-gradient(circle at 25% 72%,rgba(0,0,0,.14) 0 5%,transparent 6%)}
.sph.cloud::after{inset:0;border-radius:50%;background:repeating-linear-gradient(160deg,rgba(255,255,255,.22) 0 8%,transparent 8% 18%)}
.sph.earth::after{inset:0;border-radius:50%;background:radial-gradient(ellipse 30% 22% at 38% 40%,#4ccf7a 60%,transparent 62%),radial-gradient(ellipse 22% 28% at 68% 62%,#4ccf7a 60%,transparent 62%),radial-gradient(ellipse 18% 8% at 30% 18%,#fff 60%,transparent 64%)}
.sph.bands::after,.sph.saturn::after{inset:0;border-radius:50%;background:repeating-linear-gradient(0deg,rgba(90,50,20,.22) 0 7%,transparent 7% 16%)}
.sph.saturn::before,.sph.ring::before{left:-42%;right:-42%;top:38%;height:24%;border:3px solid rgba(255,230,180,.75);border-radius:50%;transform:rotate(-16deg);z-index:2}
.sph.ring::before{left:35%;right:35%;top:-30%;height:160%;border-color:rgba(190,240,255,.6);transform:rotate(10deg)}
.pick{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px 12px;width:100%}
.pk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;background:none;border:0;cursor:pointer;padding:5px;min-width:52px;border-radius:14px}
.pk .nm{font-size:.8rem;font-weight:600;color:var(--mu)}
.pk:hover .sph,.pk.act .sph{transform:scale(1.18);box-shadow:0 0 0 3px rgba(255,200,87,.3),0 0 22px rgba(255,200,87,.5)}
.pk.act .nm{color:var(--am)}
.bars{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.br{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:.88rem}
.bn{display:flex;align-items:center;gap:6px}
.bt{height:16px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;display:block}
.bt i{display:block;height:100%;border-radius:6px;transition:width .5s}
.bv{font-variant-numeric:tabular-nums;font-weight:700;text-align:end}
.gtime{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0}
.gtime b{display:block;height:100%;width:0;background:var(--gr);transition:width .12s linear}
.tab.good{border-color:var(--gr);background:rgba(92,242,176,.2);color:var(--gr)}
.tab.bad{border-color:var(--rd);background:rgba(255,106,92,.2);color:var(--rd)}
.tab:disabled{cursor:default;opacity:.85}
.gb{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;margin:6px 0;font-size:.86rem}
.gbt{height:16px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;display:block}
.gbt i{display:block;height:100%;border-radius:6px;transition:width .6s}
@media (max-width:560px){.br{grid-template-columns:90px 1fr 56px}.gb{grid-template-columns:100px 1fr 46px}}
/* stars */
.ptg{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.elb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:8px 4px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);cursor:pointer;line-height:1.35}
.elb b{font-family:var(--disp);font-weight:400;font-size:1.5rem;color:var(--c)}
.elb span{font-size:.75rem;color:var(--mu)}

<script>
/* ===== core: helpers, starfield, confetti, sections, deck, timer, notes ===== */
(function(){
var W=window;
W.$=function(s,r){return (r||document).querySelector(s)};
W.$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var PD='۰۱۲۳۴۵۶۷۸۹';
W.fa=function(s){return String(s).replace(/\d/g,function(d){return PD[d]})};
W.nf=function(n,d){
  d=d==null?0:d;var neg=n<0;
  var s=Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0});
  s=fa(s.replace(/,/g,'٬').replace(/\./g,'٫'));
  return neg?'⁦−'+s+'⁩':s;
};
W.clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
W.lerp=function(a,b,t){return a+(b-a)*t};
W.shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a};
W.msg=function(el,t,c){if(!el)return;el.className='pmsg '+(c||'');el.innerHTML=t};
W.shake=function(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
W.reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
W.rad=function(d){return d*Math.PI/180};
W.deg=function(r){return r*180/Math.PI};

/* animation loop helper */
W.makeLoop=function(fn){
  var raf=0,run=false,last=0;
  function step(t){if(!run)return;var dt=Math.min(.05,(t-last)/1000||0);last=t;fn(dt,t/1000);raf=requestAnimationFrame(step)}
  return {start:function(){if(run)return;run=true;last=performance.now();raf=requestAnimationFrame(step)},stop:function(){run=false;cancelAnimationFrame(raf)},get running(){return run}};
};
var REG={};
W.onSlide=function(id,o){REG[id]=o};

/* sections */
var SEC=W.SEC=[
{id:'0',t:'شوک اول',full:'شوک اول: آسمانی که گم کرده‌ایم',min:3,notes:['قلاب: آخرین بار کِی راه شیری را با چشم دیدی؟','مقایسه‌ی آسمان شهر و کویر؛ اول از بچه‌ها حدس بگیر.','آلودگی نوری فقط درباره‌ی ستاره نیست: پرندگان، لاک‌پشت‌ها، خواب انسان.']},
{id:'1',t:'آدرس کیهانی',full:'آدرس کیهانی و سفر در زمان',min:5,notes:['قلاب: اگر خورشید خاموش شود تا چند دقیقه نمی‌فهمیم؟','سال نوری واحد فاصله است، نه زمان.','تلسکوپ یعنی ماشین زمان؛ آخر بخش، تفاوت اخترشناسی و اخترگویی را کوتاه بگو.']},
{id:'2',t:'زمین متحرک',full:'زمین متحرک: سفینه‌ای در فضا',min:5,notes:['قلاب: چرا وقتی ایران تابستان است، نیمکره‌ی جنوبی زمستان دارد؟','کجی محور ۲۳٫۵ درجه عامل فصل‌هاست، نه فاصله از خورشید.','اگر وقت کم بود، «ردپای ستاره‌ها و سپر زمین» را رد کن.']},
{id:'3',t:'ماه',full:'ماه: همسایه‌ی وفادار و رازهایش',min:6,notes:['قلاب: چرا ماه به سمت ما نمی‌افتد؟','فازها = زاویه‌ی دید روشنایی خورشید، نه سایه‌ی زمین.','هر ماه گرفتگی نداریم چون مدار ماه ۵ درجه کج است.','وزن و پرش روی ماه را با یک نفر از کلاس نمایش بده.']},
{id:'4',t:'خورشید',full:'خورشید: راکتور غول‌پیکر همجوشی',min:5,notes:['قلاب: تفاوت بمب هیدروژنی با خورشید چیست؟','خورشید «نمی‌سوزد»؛ همجوشی هسته‌ای می‌کند.','هشدار ایمنی نگاه به خورشید را حتماً بگو.']},
{id:'5',t:'منظومه شمسی',full:'منظومه شمسی: دنیاهای شگفت‌انگیز',min:8,notes:['قلاب: کدام سیاره باران اسید دارد؟ کدام کوه ۲٫۵ برابر اورست؟','زهره: داغ‌تر از عطارد، با اثر گلخانه‌ای.','پلوتو: سه شرط IAU را با کلاس بررسی کن.','بازی سرعتی «کدام سیاره‌ام؟» را با دو داوطلب اجرا کن.']},
{id:'6',t:'ستاره‌ها',full:'تولد و مرگ ستاره‌ها: ما از غبار ستاره‌ایم',min:7,notes:['قلاب: آهن خون و طلای انگشتر کجا ساخته شده‌اند؟','رنگ ستاره: آبی داغ‌تر از قرمز است.','سرنوشت ستاره را جرمش تعیین می‌کند.','پازل صورت فلکی: دب اکبر و ستاره‌ی قطبی.']},
{id:'7',t:'کهکشان‌ها و وب',full:'کهکشان‌ها، ماده‌ی تاریک و چشمان جیمز وب',min:6,notes:['قلاب: اگر هرچه می‌شناسیم فقط ۵٪ جهان باشد؟','نمودار چرخش کهکشان = شاهد ماده‌ی تاریک.','برخورد با آندرومدا: ستاره‌ها تقریباً به هم نمی‌خورند.','وب در فروسرخ از میان غبار می‌بیند.']},
{id:'8',t:'رصد عملی',full:'رصد عملی: امشب چطور به آسمان نگاه کنیم؟',min:6,notes:['قلاب: بدون هزینه، همین امشب با گوشی رصدگر شو.','نقشه‌ی آسمانِ زنده برای زمان و شهر انتخابی است.','قدرت تلسکوپ را دهانه تعیین می‌کند، نه بزرگنمایی.']},
{id:'9',t:'جمع‌بندی',full:'تفکر علمی و نگاه به آینده',min:4,notes:['قلاب: بزرگ‌ترین سؤال بی‌پاسخ علم چیست؟','با بازی «راستی‌آزمایی»، شایعه‌های فضایی را آزمون کن.','مسیرهای ادامه: انجمن نجوم، کتاب، رشته‌ی تحصیلی.']},
{id:'10',t:'مسابقه',full:'چالش و کوئیز پایانی',min:5,notes:['تعداد دانش‌آموزان را وارد کن، جام حذفی یا مسابقه‌ی تیمی را شروع کن.','برای هر سؤال ۲۰ ثانیه وقت بگذار.']}
];
var secIdx={};SEC.forEach(function(s,i){secIdx[s.id]=i});
W.head=function(sec,title,hint){
  var s=SEC[secIdx[String(sec).split('.')[0]]];
  return '<div class="eyebrow rise">بخش <b>'+fa(s.id)+'</b> · '+s.t+'</div><h2 class="rise" style="--i:1">'+title+'</h2>'+(hint?'<p class="hint rise" style="--i:2">'+hint+'</p>':'');
};
W.hook=function(sec,q,ans){
  var s=SEC[secIdx[String(sec).split('.')[0]]];
  return '<div class="hookbox"><div class="eyebrow rise">بخش <b>'+fa(s.id)+'</b> · '+s.full+' · '+fa(s.min)+' دقیقه</div><h2 class="q rise" style="--i:1">'+q+'</h2>'+
   '<button class="btn rise" style="--i:2" type="button" data-reveal>اول حدس بزنید، بعد پاسخ را ببینید</button><div class="ans" hidden>'+ans+'</div></div>';
};
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-reveal]');if(!b)return;
  var a=b.parentNode.querySelector('.ans');if(a){a.hidden=!a.hidden;b.textContent=a.hidden?'اول حدس بزنید، بعد پاسخ را ببینید':'پنهان کردن پاسخ'}
});

/* starfield */
var cv=$('#sky'),cx=cv.getContext('2d'),SW=0,SH=0,stars=[],shoots=[],mx=0,my=0,tx=0,ty=0;
function sizeSky(){
  var dpr=Math.min(devicePixelRatio||1,2);SW=innerWidth;SH=innerHeight;cv.width=SW*dpr;cv.height=SH*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  var n=Math.min(380,Math.round(SW*SH/5200));stars=[];
  for(var i=0;i<n;i++)stars.push({x:Math.random()*SW,y:Math.random()*SH,r:Math.random()*1.25+.25,z:Math.random()*.9+.1,p:Math.random()*6.28,s:.5+Math.random()*1.6,h:Math.random()});
}
function drawSky(t){
  cx.clearRect(0,0,SW,SH);mx+=(tx-mx)*.04;my+=(ty-my)*.04;
  for(var i=0;i<stars.length;i++){var s=stars[i],a=.3+.7*Math.abs(Math.sin(t/1000*s.s+s.p));
    cx.fillStyle=s.h>.85?'rgba(255,214,150,'+a+')':s.h<.15?'rgba(160,200,255,'+a+')':'rgba(255,255,255,'+a+')';
    cx.beginPath();cx.arc(s.x+mx*s.z*24,s.y+my*s.z*24,s.r,0,6.283);cx.fill()}
  if(!reduce&&Math.random()<.0035&&shoots.length<2)shoots.push({x:Math.random()*SW*.9+SW*.1,y:Math.random()*SH*.4,vx:-(5+Math.random()*4),vy:2.5+Math.random()*2,l:0});
  for(var k=shoots.length-1;k>=0;k--){var m=shoots[k];m.x+=m.vx;m.y+=m.vy;m.l++;
    var g=cx.createLinearGradient(m.x,m.y,m.x-m.vx*9,m.y-m.vy*9);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');
    cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(m.x,m.y);cx.lineTo(m.x-m.vx*9,m.y-m.vy*9);cx.stroke();
    if(m.l>70||m.x<-50||m.y>SH+50)shoots.splice(k,1)}
  if(!reduce)requestAnimationFrame(drawSky);
}
sizeSky();addEventListener('resize',function(){sizeSky();if(reduce)drawSky(0)});
addEventListener('pointermove',function(e){tx=(e.clientX/SW-.5)*2;ty=(e.clientY/SH-.5)*2},{passive:true});
requestAnimationFrame(drawSky);

/* confetti */
var cf=$('#confetti'),cc=cf.getContext('2d'),parts=[],cfRun=false;
W.confetti=function(){

    else{

function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function nextQ(){if(pi>=pool.length){pool=sh(Q.map(function(_,i){return i}));pi=0}var q=Q[pool[pi++]],opts=q[1].map(function(t,i){return {t:t,ok:i===q[2]}});if(q[1]!==TF)opts=sh(opts);return {q:q[0],o:opts}}
var LAB=['الف','ب','ج','د'],COL=['#ff6b6b','#4fd8ff','#ffc857','#5cf2b0'];
function qHTML(q,cls){return '<div class="q" style="min-height:2.6em">'+q.q+'</div><div class="opts '+(q.o.length==2?'two':'')+'">'+q.o.map(function(o,i){return '<button class="opt" type="button" data-i="'+i+'" style="--c:'+COL[i]+'"><b>'+(q.o.length==2?(i?'✕':'✓'):LAB[i])+'</b> '+o.t+'</button>'}).join('')+'</div>'}

/* ----- elimination cup ----- */
function cup(){
  var el=$('#qb');el.innerHTML='<div class="panel" id="cs0" style="max-width:520px;margin:auto"><h3>تعداد دانش‌آموزان</h3><div class="ctl"><label for="cn"><span>تعداد</span><b id="cnv">۲۰</b></label><input id="cn" type="range" min="2" max="60" value="20"></div><label class="inl"><input type="checkbox" id="ctm" checked> زمان‌سنج ۲۰ ثانیه‌ای</label><div class="row"><button class="btn" id="cgo" type="button">شروع مسابقه</button></div></div>';
  $('#cn').oninput=function(){$('#cnv').textContent=nf(+this.value)};
  $('#cgo').onclick=function(){run(+$('#cn').value,$('#ctm').checked)};
  function run(n,useT){
    var alive=[],out={},round=1,queue=[],cur=null,hist=[],rnd=[],answered=false,qq=null;
    for(var i=1;i<=n;i++)alive.push(i);
    el.innerHTML='<div class="grid21"><div class="panel"><div class="lab" id="ci"></div><div class="draw" id="cd">؟</div><div id="cq"></div><div class="callout" id="cf" hidden></div><div class="row"><button class="btn" id="cb" type="button">قرعه‌کشی نفر بعدی</button><button class="btn sm ghost" id="cu" type="button">برگشت</button><span class="tmr" id="ct" hidden></span></div></div><div class="panel"><h3>وضعیت دانش‌آموزان</h3><div class="grid-n" id="cg"></div><div class="hint">سبز: زنده، قرمز: حذف‌شده</div></div></div>';
    function board(){$('#cg').innerHTML=Array.apply(null,Array(n)).map(function(_,k){var s=k+1,c=out[s]?'dead':rnd.indexOf(s)>=0?'pass':'';return '<span class="nb '+c+(cur===s?' now':'')+'">'+nf(s)+'</span>'}).join('')}
    function newRound(){queue=sh(alive);rnd=[];$('#ci').textContent='دور '+nf(round)+' • '+nf(alive.length)+' نفر باقی‌مانده';board()}
    function pickNext(){
      if(!queue.length){endRound();return}
      var target=queue[0],ticks=0,box=$('#cd');$('#cb').disabled=true;$('#cf').hidden=true;$('#cq').innerHTML='';
      var iv=setInterval(function(){box.textContent=nf(alive[Math.floor(Math.random()*alive.length)]);if(++ticks>16||reduce){clearInterval(iv);box.textContent=nf(target);cur=target;queue.shift();qq=nextQ();$('#cq').innerHTML=qHTML(qq);answered=false;board();$$('.opt',$('#cq')).forEach(function(b){b.onclick=function(){ans(+b.getAttribute('data-i'))}});if(useT){$('#ct').hidden=false;timer($('#ct'),20,function(){ans(-1)})}}},70);
    }
    function ans(i){
      if(answered)return;answered=true;stopT();var ok=i>=0&&qq.o[i].ok;
      $$('.opt',$('#cq')).forEach(function(b,k){b.disabled=true;if(qq.o[k].ok)b.classList.add('good');else if(k===i)b.classList.add('bad')});
      hist.push({s:cur,ok:ok,qq:qq});
      if(ok){rnd.push(cur);msg($('#cf'),'شماره‌ی '+nf(cur)+' درست جواب داد و می‌ماند.','ok')}else{msg($('#cf'),'شماره‌ی '+nf(cur)+(i<0?' پاسخی نداد':' اشتباه جواب داد')+' و حذف می‌شود.','no')}
      $('#cf').hidden=false;$('#cb').disabled=false;$('#cb').textContent=queue.length?'قرعه‌کشی نفر بعدی':'پایان دور';board();
    }
    function endRound(){
      var survivors=rnd.slice(),wasOut=alive.filter(function(s){return survivors.indexOf(s)<0});
      if(!survivors.length){msg($('#cf'),'هیچ‌کس درست جواب نداد! این دور باطل شد و همه می‌مانند.','no');$('#cf').hidden=false;round++;newRound();$('#cb').textContent='دور تازه';$('#cd').textContent='؟';$('#cb').disabled=false;return}
      wasOut.forEach(function(s){out[s]=round});alive=survivors;
      if(alive.length===1){champion(alive[0]);return}
      round++;newRound();$('#cd').textContent='؟';$('#cq').innerHTML='';$('#cf').hidden=false;msg($('#cf'),'دور بعدی با '+nf(alive.length)+' نفر شروع می‌شود.','ok');$('#cb').textContent='قرعه‌کشی نفر بعدی';$('#cb').disabled=false;
    }
    function champion(s){$('#ci').textContent='پایان مسابقه';$('#cd').textContent=nf(s);$('#cq').innerHTML='<div class="champ">🏆 قهرمان: شماره‌ی '+nf(s)+'</div>';$('#cb').textContent='مسابقه‌ی تازه';$('#cb').disabled=false;$('#cb').onclick=cup;$('#cu').hidden=true;$('#cf').hidden=true;confetti();board()}
    $('#cb').onclick=function(){if(!queue.length&&rnd.length+Object.keys(out).length>=0&&answered){endRound()}else pickNext()};
    $('#cu').onclick=function(){var h=hist.pop();if(!h||!answered&&0)return;if(h.ok){rnd=rnd.filter(function(x){return x!==h.s})}queue.unshift(h.s);answered=false;stopT();$('#cq').innerHTML=qHTML(h.qq);qq=h.qq;cur=h.s;$$('.opt',$('#cq')).forEach(function(b){b.onclick=function(){ans(+b.getAttribute('data-i'))}});$('#cf').hidden=true;queue.shift();board()};
    newRound();
  }
}

function team(){
  var el=$('#qb');el.innerHTML='<div class="panel" style="max-width:520px;margin:auto"><h3>مسابقه‌ی تیمی</h3><div class="ctl"><label for="tn"><span>تعداد تیم</span><b id="tnv">۴</b></label><input id="tn" type="range" min="2" max="8" value="4"></div><div class="ctl"><label for="tq"><span>تعداد پرسش</span><b id="tqv">۱۰</b></label><input id="tq" type="range" min="5" max="30" value="10"></div><div class="row"><button class="btn" id="tgo" type="button">شروع</button></div></div>';
  $('#tn').oninput=function(){$('#tnv').textContent=nf(+this.value)};$('#tq').oninput=function(){$('#tqv').textContent=nf(+this.value)};
  $('#tgo').onclick=function(){run(+$('#tn').value,+$('#tq').value)};
  function run(T,N){
    var sc=Array(T).fill(0),k=0,got={},qq;
    el.innerHTML='<div class="grid21"><div class="panel"><div class="row"><span class="lab" id="tc"></span><span class="tmr" id="tt">۲۰</span></div><div id="tqd"></div><div class="callout" id="tr2" hidden></div><div class="row"><button class="btn" id="tre" type="button">نمایش پاسخ</button><button class="btn sm" id="tx" type="button" hidden>ثبت امتیاز و بعدی</button></div></div><div class="panel"><h3>تیم‌ها</h3><div id="ts"></div><div class="hint">بعد از نمایش پاسخ، تیم‌های درست‌پاسخ را علامت بزن.</div></div></div>';
    function board(){$('#ts').innerHTML=sc.map(function(s,i){return '<button type="button" class="tmb'+(got[i]?' on':'')+'" data-i="'+i+'" style="--c:'+COL[i%4]+'"><b>تیم '+nf(i+1)+'</b><span>'+nf(s)+' امتیاز</span></button>'}).join('');$$('.tmb',$('#ts')).forEach(function(b){b.onclick=function(){if($('#tx').hidden)return;var i=b.getAttribute('data-i');got[i]=!got[i];board()}})}
    function ask(){got={};qq=nextQ();$('#tc').textContent='پرسش '+nf(k+1)+' از '+nf(N);$('#tqd').innerHTML=qHTML(qq);$$('.opt',$('#tqd')).forEach(function(b){b.disabled=true});$('#tr2').hidden=true;$('#tx').hidden=true;$('#tre').hidden=false;board();timer($('#tt'),20,reveal)}
    function reveal(){stopT();$$('.opt',$('#tqd')).forEach(function(b,i){if(qq.o[i].ok)b.classList.add('good')});$('#tre').hidden=true;$('#tx').hidden=false;$('#tx').textContent=k<N-1?'ثبت امتیاز و بعدی':'ثبت و نمایش نتیجه';board()}
    $('#tre').onclick=reveal;
    $('#tx').onclick=function(){Object.keys(got).forEach(function(i){if(got[i])sc[i]+=10});k++;if(k<N)ask();else podium()};
    function podium(){stopT();var o=sc.map(function(s,i){return [i,s]}).sort(function(a,b){return b[1]-a[1]});
      el.innerHTML='<div class="panel" style="max-width:520px;margin:auto"><h3>نتیجه‌ی نهایی</h3>'+o.map(function(x,j){return '<div class="pod" style="--c:'+COL[x[0]%4]+'"><b>'+['🥇','🥈','🥉'][j]||''+'</b> تیم '+nf(x[0]+1)+' — '+nf(x[1])+' امتیاز</div>'}).join('')+'<div class="row"><button class="btn" id="tn2" type="button">مسابقه‌ی تازه</button></div></div>';confetti();$('#tn2').onclick=team}
    ask();
  }
}
['مسابقه‌ی حذفی (جام)','مسابقه‌ی تیمی'].forEach(function(t,i){var b=document.createElement('button');b.type='button';b.className='tab'+(i?'':' act');b.textContent=t;b.onclick=function(){stopT();$$('.tab',$('#qt')).forEach(function(x,k){x.classList.toggle('act',k===i)});i?team():cup()};$('#qt').appendChild(b)});
cup();
